openapi: 3.1.0
info:
  title: AWAP AI Layer
  version: 0.1.0
  description: |
    Versioned contract for the AI layer.

    Implemented: liveness/readiness, the Phase 2 Copilot API, permission-checked
    backend tool execution, HITL confirmation, dynamic model routing, versioned
    prompts and tenant-scoped knowledge search. LangGraph owns only agent-internal
    state; business workflow state remains in the Java Workflow Engine.
servers:
  - url: http://localhost:8000
    description: Local AI layer
paths:
  /api/v1/health:
    get:
      operationId: health
      summary: Liveness and build metadata
      description: Returns the documented liveness contract for the AI layer.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
                service: ai-layer
                version: 0.1.0
                build: local
                python: 3.15.0
  /api/v1/health/live:
    get:
      operationId: liveness
      summary: Kubernetes liveness probe
      description: Liveness only; it never probes downstream dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health/ready:
    get:
      operationId: readiness
      summary: Kubernetes readiness probe
      description: |
        Checks the configured dependency (`AI_LAYER_DEPENDENCY_URL`). When the
        dependency is unreachable the endpoint returns 503 and status DOWN.
      responses:
        "200":
          description: Every configured dependency is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: UP
                service: ai-layer
                version: 0.1.0
                build: local
                python: 3.15.0
                dependency: none
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: DOWN
                service: ai-layer
                version: 0.1.0
                build: local
                python: 3.15.0
                dependency: ConnectError
  /api/v1/copilot/chat:
    post:
      operationId: copilotChat
      summary: Run one Copilot turn
      description: >-
        Accepts a natural-language request with the backend-forwarded security context. High-risk
        actions return `requires_human_approval=true` until the caller re-sends with
        `confirm_high_risk=true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotRequest"
      responses:
        "200":
          description: Copilot response envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotResponse"
        "401":
          description: Missing or invalid service/user security context.
  /api/v1/copilot/tasks:
    get:
      operationId: copilotTasks
      summary: Query the caller's tasks
      responses:
        "200":
          description: Copilot response envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotResponse"
  /api/v1/copilot/tasks/{task_id}/complete:
    post:
      operationId: copilotCompleteTask
      summary: Submit a task decision through the Copilot
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum: [approve, reject, complete]
                comment:
                  type: string
                confirm_high_risk:
                  type: boolean
      responses:
        "200":
          description: Copilot response envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotResponse"
  /api/v1/copilot/knowledge/search:
    post:
      operationId: copilotKnowledgeSearch
      summary: Search tenant documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
      responses:
        "200":
          description: Copilot response envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotResponse"
  /api/v1/copilot/jobs:
    post:
      operationId: copilotSubmitJob
      summary: Submit a long-running Copilot job
      description: >-
        Returns 202 with a job handle. A duplicate submission with the same tenant-scoped
        `idempotency_key` returns the original job; a full bounded queue returns 429.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotRequest"
      responses:
        "202":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotJobResponse"
        "401":
          description: Missing or invalid service/user security context.
        "429":
          description: The bounded async job queue is full.
  /api/v1/copilot/jobs/{job_id}:
    get:
      operationId: copilotJobStatus
      summary: Poll an async Copilot job
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state and result when finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotJobResponse"
        "401":
          description: Missing or invalid service/user security context.
        "404":
          description: Unknown, expired, or another tenant's/user's job.
  /api/v1/copilot/jobs/{job_id}/cancel:
    post:
      operationId: copilotCancelJob
      summary: Cancel an async Copilot job
      description: >-
        Marks a queued or running job CANCELLED. Provider cancellation is best effort and a late
        answer never overwrites the cancelled state.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotJobResponse"
        "401":
          description: Missing or invalid service/user security context.
        "404":
          description: Unknown, expired, or another tenant's/user's job.
  /api/v1/copilot/prompts:
    get:
      operationId: copilotPrompts
      summary: List versioned prompts
      responses:
        "200":
          description: Prompt descriptors.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/copilot/metrics:
    get:
      operationId: copilotMetrics
      summary: Read Copilot counters and latency percentiles
      description: >-
        Returns counters, the active prompt version and hashes, and per-tag p50/p95/p99 latency for
        synchronous requests, provider calls and async job queue waits.
      responses:
        "200":
          description: Copilot counters, prompt hashes and latency percentiles.
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    CopilotRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          maxLength: 8000
        action:
          type: string
        context:
          type: object
        idempotency_key:
          type: string
        confirm_high_risk:
          type: boolean
    CopilotJobResponse:
      type: object
      required: [id, status, prompt_version, created_at, updated_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        result:
          $ref: "#/components/schemas/CopilotResponse"
        error:
          type: string
          nullable: true
        prompt_version:
          type: string
        prompt_hash:
          type: string
          nullable: true
        queue_wait_ms:
          type: number
          nullable: true
        created_at:
          type: number
        updated_at:
          type: number
    CopilotResponse:
      type: object
      required:
        - answer
        - action
        - confidence
        - requires_human_approval
        - tool_calls
        - prompt_version
        - correlation_id
      properties:
        answer:
          type: string
        action:
          type: string
        confidence:
          type: number
        requires_human_approval:
          type: boolean
        tool_calls:
          type: array
          items:
            type: object
        data: {}
        model:
          type: string
          nullable: true
        model_tier:
          type: string
          nullable: true
        routing_reason:
          type: string
          nullable: true
        routing_policy:
          type: string
          nullable: true
        estimated_cost_micros:
          type: integer
          nullable: true
        prompt_version:
          type: string
        correlation_id:
          type: string
        idempotency_key:
          type: string
          nullable: true
        prompt_key:
          type: string
        prompt_hash:
          type: string
        cache_hit:
          type: boolean
        provider:
          type: string
          nullable: true
        fallback_reason:
          type: string
          nullable: true
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - build
        - python
      properties:
        status:
          type: string
          enum: [UP]
        service:
          type: string
          const: ai-layer
        version:
          type: string
          example: 0.1.0
        build:
          type: string
          description: Build SHA from `AI_LAYER_BUILD_SHA`, or `local`.
        python:
          type: string
          example: 3.15.0
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - build
        - python
        - dependency
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        service:
          type: string
          const: ai-layer
        version:
          type: string
          example: 0.1.0
        build:
          type: string
          description: Build SHA from `AI_LAYER_BUILD_SHA`, or `local`.
        python:
          type: string
          example: 3.15.0
        dependency:
          type: string
          description: "`none`, `HTTP <status>`, or the dependency exception name."
