[project]
name = "awap-ai-layer"
version = "0.1.0"
description = "AI Layer of the AI-Native Workflow Automation Platform"
requires-python = ">=3.15.0,<3.16"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "langgraph==1.2.15",
    "grpcio>=1.85.1",
    "protobuf>=7.36.2",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.1",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Force a certifi release that fixes GHSA-6q48-6c7w-9gw2 (bundled compromised root CAs).
override-dependencies = ["certifi>=2026.10.19"]

[tool.ruff]
line-length = 100
target-version = "py315"
# Generated protobuf/gRPC stubs are committed for reproducible builds; never lint them.
extend-exclude = ["ai/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection idiom uses Depends(...) in parameter defaults.
"app/api/*.py" = ["B008"]
