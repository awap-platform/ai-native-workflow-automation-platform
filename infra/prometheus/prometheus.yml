global:
  scrape_interval: 15s

rule_files:
  - alert-rules.yml
  # CDC rules are loaded only when the Debezium connector is deployed (issue #131); the file is
  # valid even without the slot, the series simply stay absent.
  - cdc-alert-rules.yml
  # Real-user performance alerts (issue #375); they stay quiet until RUM samples arrive.
  - rum-alert-rules.yml

scrape_configs:
  - job_name: awap-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  # postgres_exporter provides the replication-slot series used by cdc-alert-rules.yml.
  # Slot series only appear once the Debezium connector has created the slot.
  - job_name: awap-postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # The frontend exposes the RUM histogram rendered by /api/rum/metrics (issue #375). The endpoint
  # answers 204 while the rum_vitals flag is off, so the target stays healthy either way.
  - job_name: awap-frontend-rum
    metrics_path: /api/rum/metrics
    static_configs:
      - targets: ["frontend:3000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
